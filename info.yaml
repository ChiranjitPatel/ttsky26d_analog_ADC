# Tiny Tapeout project information
project:
  title:        "Bandgap-referenced 8-bit SAR ADC + temperature sensor"      # Project title
  author:       "Chiranjit Vivek"      # Your name
  discord:      "cj_pat"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit SAR ADC with on-chip bandgap reference and PTAT temperature sensor"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 2        # Valid values: 0 to 6
  uses_vapwr: false       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_chiranjitpatel_sar_adc"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "START / EXT_D0"
  ui[1]: "AMUX_SEL0 / EXT_D1"
  ui[2]: "AMUX_SEL1 / EXT_D2"
  ui[3]: "BG_PD / EXT_D3"
  ui[4]: "EXT_D4"
  ui[5]: "EXT_D5"
  ui[6]: "EXT_D6"
  ui[7]: "EXT_D7"

  # Outputs
  uo[0]: "D0"
  uo[1]: "D1"
  uo[2]: "D2"
  uo[3]: "D3"
  uo[4]: "D4"
  uo[5]: "D5"
  uo[6]: "D6"
  uo[7]: "D7"

  # Bidirectional pins
  uio[0]: "MODE"
  uio[1]: "EXT_SAMPLE"
  uio[2]: "EXT_CMP_CLK"
  uio[3]: "REF_SEL"
  uio[4]: "CMP_OUT"
  uio[5]: "EOC"
  uio[6]: "INSEL0"
  uio[7]: "INSEL1"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "VIN"
  ua[1]: "AMUX / VREF_EXT"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
